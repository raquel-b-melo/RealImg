spring.application.name=Realimg

aws.accessKeyId=${ACCESS_KEY}
aws.secretKey=${SECRET_KEY}
aws.region=${REGION}
aws.s3.bucket=${BUCKET_NAME}

spring.datasource.url=jdbc:mysql://localhost:3306/realimg
spring.datasource.username=${USER_MYSQL}
spring.datasource.password=${PASSWORD_MYSQL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

spring.datasource.hikari.maximum-pool-size=10

logging.level.org.hibernate=ERROR
logging.level.org.hibernate.orm.connections.pooling=ERROR

spring.security.user.name=${USER_SPRING}
spring.security.user.password=${PASSWORD_SPRING}
